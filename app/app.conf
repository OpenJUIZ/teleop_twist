# teleop_twist の起動設定
#   開発中: scripts/dev_plugin.sh でプラグインを app/plugins/<target>/ に置いてから
#           juiz -f app/app.conf -d          (mobile_sim にはつながない。cmd_vel はこの System の中だけ)
#   パッケージ: juiz run teleop_twist-<version>.juizapp   (depends の mobile_sim に IPC でつなぐ)
"name": "teleop_twist"
"option":
  "http_broker":
    "start": true
    # mobile_sim は 8000、mapper_gmapping は 8001 を使う
    "port": 8002
    # ブラウザ画面(conf のディレクトリからの相対)
    "static_filepaths":
      "/": "web"
"plugins":
  "components":
    "teleop_twist":
      "language": "rust"
      "path": "plugins/{target}"
"containers":
  - "type_name": "teleop_twist"
    "name": "teleop0"
    # 入力いっぱい・倍率 1 のときの速度。vy は全方向移動のロボットだけが使う
    "max_velocity": { "vx": 0.5, "vy": 0.5, "omega": 1.0 }
    # 速度の倍率の初期値(0.1〜1)。画面で変えられる
    "scale": 0.5
    # 入力がこの秒数途切れたら 0 を出す
    "timeout": 0.5
    "processes":
      # main_ec が 20 Hz で呼び、Twist2D をトピック cmd_vel に出す
      - "type_name": "teleop_twist_output"
        "name": "output0"
        "use_memo": false
        "publishes":
          - "cmd_vel"
      - "type_name": "teleop_twist_set_command"
        "name": "set_command0"
        "use_memo": false
      - "type_name": "teleop_twist_set_scale"
        "name": "set_scale0"
        "use_memo": false
      - "type_name": "teleop_twist_stop"
        "name": "stop0"
        "use_memo": false
      - "type_name": "teleop_twist_get_state"
        "name": "get_state0"
        "use_memo": false
"ecs":
  - "type_name": "main_loop_ec"
    "name": "main_ec"
    "rate": 20
    "bind":
      - "type_name": "teleop_twist_output"
        "name": "output0"
        "container_name": "teleop0"
    "auto_start": true
